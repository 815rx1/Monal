# Builds an unsigned iOS IPA on GitHub-hosted macOS runners.
# The resulting IPA has to be (re-)signed on install, e.g. with SideStore/AltStore.
name: fork-unsigned-ipa

on:
  push:
    branches-ignore: [ develop, beta, stable, quicksy ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_unsigned_ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          submodules: true
          fetch-depth: 1000
          fetch-tags: true
          show-progress: true
          lfs: true
      - name: Checkout submodules
        run: git submodule update -f --init --remote
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.2.app/Contents/Developer'
      - name: Install coreutils
        run: brew install coreutils
      - name: Write git hash include
        run: echo "#define ALPHA_COMMIT_HASH \"$(git rev-parse --short HEAD)\"" > Monal/Classes/commithash.h
      - name: Build rust
        run: bash ./rust/build-rust.sh
      - name: Install pods
        working-directory: Monal
        run: pod install --repo-update
      - name: Build unsigned archive
        working-directory: Monal
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Monal.xcworkspace \
            -scheme "Monal Alpha" \
            -sdk iphoneos \
            -configuration Alpha \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Monal.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify --renderer github-actions
      - name: Package IPA
        run: |
          APP="$(find "$RUNNER_TEMP/Monal.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)"
          echo "Packaging $APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          APP="$RUNNER_TEMP/ipa/Payload/$(basename "$APP")"

          # Ad-hoc sign with a minimal set of entitlements, so SideStore/AltStore know which
          # app group and keychain group to register when re-signing (unsigned builds carry no
          # entitlements at all and Monal crashes on start without its app group container).
          ENT="$RUNNER_TEMP/sideload.entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" \
            -c "Add :com.apple.security.application-groups:0 string group.monalalpha" \
            -c "Add :keychain-access-groups array" \
            -c "Add :keychain-access-groups:0 string AAAAAAAAAA.monal.alpha" \
            -c "Add :application-identifier string AAAAAAAAAA.$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" \
            -c "Add :com.apple.developer.team-identifier string AAAAAAAAAA" \
            "$ENT"
          cat "$ENT"
          find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -print0 | \
            xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          codesign --force --sign - --timestamp=none --entitlements "$ENT" "$APP"
          codesign -d --entitlements - "$APP"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Monal-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: Monal-unsigned.ipa
          path: Monal-unsigned.ipa
          archive: false
          if-no-files-found: error
      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
